<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - MacroSnap</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/833/833472.png">
</head>
<body>
    <div class="login-container">
        <h2>Create Account</h2>
        <div class="login-error" id="register-error"></div>
        <form id="register-form" autocomplete="off">
            <label for="register-username">Username</label>
            <input type="text" id="register-username" required placeholder="Choose username" autocomplete="username">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" required placeholder="Choose password" autocomplete="new-password">
            <button type="submit">Create Account</button>
        </form>
        <div class="switch-link">Already have an account? <a href="/login.html">Login here</a></div>
    </div>
    <script type="module" src="/src/register.js"></script>
</body>
</html>
